<script type="module">
  // Background WebGPU piece. Renders a raymarched scene behind the page on a
  // handful of routes, and bows out quietly if WebGPU isn't available.

  const CONFIG = {
    // Only run on these routes.
    paths: ["/", "/about/", "/projects/", "/articles/"],

    // Render resolution as a fraction of the window, per tier. 0.5 is the
    // original half-res look; lower tiers are cheaper on weaker hardware.
    resolutionScale: { low: 0.20, medium: 0.35, high: 0.50 },

    // Camera feel.
    spinSpeed: 0.6,   // yaw speed at full horizontal mouse travel
    minSpin: 0.2,     // never quite stop, so it keeps drifting when idle
    colorFade: 3.0,   // red <-> white crossfade speed

    // Intro: the background comes up blurry and sharpens once. This is the
    // visible "low to high" — a blur reads like resolution, eases smoothly on
    // any device, and only runs at load.
    introBlur: 10,    // px the intro starts from (higher = starts softer)
    introMs: 1200,    // how long it takes to sharpen
  };

  // Shader reads this as uniforms.quality (0 / 1 / 2).
  const TIERS = ["low", "medium", "high"];

  // Pick a tier once, from the device — no frame-rate guessing, so it's the
  // same every load. Reduced-motion stays low, touch devices medium, desktop
  // high. Returns { tier, reduce }.
  function pickTier() {
    const mm = (q) => window.matchMedia && matchMedia(q).matches;
    const reduce = mm("(prefers-reduced-motion: reduce)");
    let tier = 2;
    if (reduce) tier = 0;
    else if (mm("(pointer: coarse)")) tier = 1;
    return { tier, reduce };
  }

  async function initWebGPU() {
    if (!CONFIG.paths.includes(window.location.pathname)) return;
    if (!navigator.gpu) { console.log("WebGPU not supported"); return; }

    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) { console.log("No WebGPU adapter"); return; }
    const device = await adapter.requestDevice();

    const { tier, reduce } = pickTier();

    // Full-screen canvas pinned behind everything. Starts blurry and eases to
    // sharp (unless the visitor asked for reduced motion).
    document.body.style.backgroundColor = "transparent";
    const canvas = document.createElement("canvas");
    canvas.id = "webgpu-bg";
    document.body.prepend(canvas);
    Object.assign(canvas.style, {
      position: "fixed", top: "0", left: "0",
      width: "100vw", height: "100vh",
      zIndex: "-1", pointerEvents: "none",
      filter: reduce ? "blur(0px)" : `blur(${CONFIG.introBlur}px)`,
    });

    const context = canvas.getContext("webgpu");
    const format = navigator.gpu.getPreferredCanvasFormat();

    // Shader source is inlined by Hugo from the assets folder at build time.
    {{ $shader := resources.Get "shaders/main.wgsl" }}
    {{ with $shader }}
        const shaderCode = `{{ .Content }}`;
    {{ else }}
        console.error("CRITICAL ERROR: 'assets/shaders/main.wgsl' not found!");
        return;
    {{ end }}

    const shaderModule = device.createShaderModule({ code: shaderCode });
    const pipeline = device.createRenderPipeline({
      layout: "auto",
      vertex: { module: shaderModule, entryPoint: "vs_main" },
      fragment: {
        module: shaderModule,
        entryPoint: "fs_main",
        targets: [{ format }],
      },
      primitive: { topology: "triangle-list" },
    });

    // 8 floats / 32 bytes: [w, h, time, colorT, yaw, pitch, quality, pad].
    const uniformValues = new Float32Array(8);
    uniformValues[6] = tier;
    const uniformBuffer = device.createBuffer({
      size: uniformValues.byteLength,
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });
    const bindGroup = device.createBindGroup({
      layout: pipeline.getBindGroupLayout(0),
      entries: [{ binding: 0, resource: { buffer: uniformBuffer } }],
    });

    // --- interaction state -------------------------------------------------
    let targetColorT = 0.0;   // 0 = red, 1 = white
    let currentColorT = 0.0;

    let spinInput = 0.5;      // -1..1 from horizontal mouse position
    let cameraPitch = 0.5;    // -1..1 from vertical mouse position
    let cameraYaw = 0.0;

    // Only used to tell a click apart from a drag.
    let pressX = 0, pressY = 0;

    const toggleColor = () => { targetColorT = targetColorT === 0.0 ? 1.0 : 0.0; };

    window.addEventListener("keydown", (e) => {
      if (e.key.toLowerCase() === "c") toggleColor();
    });

    window.addEventListener("mousedown", (e) => { pressX = e.clientX; pressY = e.clientY; });
    window.addEventListener("mouseup", (e) => {
      const travel = Math.abs(e.clientX - pressX) + Math.abs(e.clientY - pressY);
      if (travel < 5) toggleColor(); // a click, not a drag
    });
    window.addEventListener("mousemove", (e) => {
      spinInput = Math.max(-1.0, Math.min(1.0, (e.clientX / window.innerWidth) * 2.0 - 1.0));
      cameraPitch = (e.clientY / window.innerHeight) * 2.0 - 1.0;
    });

    // --- sizing ------------------------------------------------------------
    // Configure the swapchain once; resizing the canvas element afterwards is
    // enough on its own — the next getCurrentTexture() adopts the new size.
    context.configure({ device, format, alphaMode: "premultiplied" });

    function applySize() {
      const scale = CONFIG.resolutionScale[TIERS[tier]];
      const w = Math.max(1, Math.floor(window.innerWidth * scale));
      const h = Math.max(1, Math.floor(window.innerHeight * scale));
      if (w === canvas.width && h === canvas.height) return;
      canvas.width = w;
      canvas.height = h;
      uniformValues[0] = w;
      uniformValues[1] = h;
    }

    // Page zoom (Ctrl +/-) fires "resize" because CSS-pixel innerWidth changes
    // even though the window's physical size hasn't. Track physical pixels and
    // only rebuild when those move, so zooming leaves the resolution untouched.
    let lastPhysW = 0, lastPhysH = 0;
    function onResize() {
      const dpr = window.devicePixelRatio || 1;
      const physW = Math.round(window.innerWidth * dpr);
      const physH = Math.round(window.innerHeight * dpr);
      if (Math.abs(physW - lastPhysW) <= 2 && Math.abs(physH - lastPhysH) <= 2) return;
      lastPhysW = physW;
      lastPhysH = physH;
      applySize();
    }
    window.addEventListener("resize", onResize);
    onResize();

    // --- frame loop --------------------------------------------------------
    let lastTime = performance.now() / 1000;
    let introStarted = false;

    function frame() {
      const time = performance.now() / 1000;
      // Clamp dt so a backgrounded tab doesn't fling the camera on return.
      const dt = Math.min(time - lastTime, 0.1);
      lastTime = time;

      // Keep a little idle spin regardless of how gentle the mouse input is.
      let speed = spinInput * CONFIG.spinSpeed;
      if (speed >= 0 && speed < CONFIG.minSpin) speed = CONFIG.minSpin;
      else if (speed < 0 && speed > -CONFIG.minSpin) speed = -CONFIG.minSpin;
      cameraYaw += speed * dt;

      currentColorT += (targetColorT - currentColorT) * CONFIG.colorFade * dt;

      uniformValues[2] = time;
      uniformValues[3] = currentColorT;
      uniformValues[4] = cameraYaw;
      uniformValues[5] = cameraPitch;
      device.queue.writeBuffer(uniformBuffer, 0, uniformValues);

      const encoder = device.createCommandEncoder();
      const pass = encoder.beginRenderPass({
        colorAttachments: [{
          view: context.getCurrentTexture().createView(),
          clearValue: { r: 0.0, g: 0.0, b: 0.0, a: 0.0 },
          loadOp: "clear",
          storeOp: "store",
        }],
      });
      pass.setPipeline(pipeline);
      pass.setBindGroup(0, bindGroup);
      pass.draw(3);
      pass.end();
      device.queue.submit([encoder.finish()]);

      // Once the first frame is on screen, ease the intro blur off to sharp.
      if (!introStarted) {
        introStarted = true;
        if (!reduce) {
          canvas.style.transition = `filter ${CONFIG.introMs}ms ease-out`;
          void canvas.offsetWidth;           // commit the starting blur first
          canvas.style.filter = "blur(0px)";
        }
      }

      requestAnimationFrame(frame);
    }
    frame();
  }

  initWebGPU();
</script>
