<script type="module">
  // Copyright (c) 2026 depis. All Rights Reserved.
  // -----------------------------------------------------------------------
  // 0. DEBUG, ROUTING & UI MACROS
  // -----------------------------------------------------------------------
  const SHOW_PERF_HUD            = false;  // Starts hidden; unlock secretly with "fps" or 5 top-left taps
  const SECRET_HUD_CODE          = "fps";  // Type this word on PC to toggle the Perf HUD
  const SECRET_CORNER_TAPS       = 5;      // Tap top-left corner this many times on Phone/PC to toggle HUD
  const FORCE_MAX_QUALITY        = false;  // Locks quality = 2.0, disables CSS blur, bypasses governor
  const FORCE_NATIVE_RES         = false;  // If true (with FORCE_MAX_QUALITY), forces 1.0x scale instead of maxFine (0.55x)

  // Subtle Interaction Hint Popup
  const SHOW_INTERACTION_HINT    = true;    // Shows a subtle fade-in/out prompt on page load
  const HINT_DISPLAY_MS          = 5500;    // How long (ms) the hint stays visible before fading out
  const HINT_BOTTOM_OFFSET       = "188px"; // Moved higher so it clears bottom UI / Ko-fi widget

  // Default Shader Selection
  const DEFAULT_SHADER           = "WildInTheRose"; // Locked to the Rose shader for now
  const RANDOMIZE_DEFAULT_SHADER = false;           // Flip to true later when you want random rotation back

  // Exact-match allowlist for hub/menu pages and About Me (always end with '/').
  // Sub-pages like "/projects/my-project/" or "/articles/my-article/" will NOT match and stay shader-free.
  const ALLOWED_MENU_ROUTES = [
    "/",
    "/index.html/",
    "/about/",
    "/projects/",
    "/articles/",
    "/posts/",
    "/blog/",
    "/digitalartwork/"
  ];

  // 1. GLOBALS & INTERACTION STATE
  const inputState = {
    colorT: 0.0,
    targetColorT: 0.0,
    spinInput: 0.5,
    cameraPitch: 0.5,
    cameraYaw: 0.0,
    clickTime: -100.0 // Timestamp of the last left-click/tap (triggers the wild event)
  };

  // 2. SHADER CONFIGURATIONS
  const SHADER_REGISTRY = {
    "WildInTheRose": {
      startScale: 0.22, minScale: 0.15, maxCoarse: 0.42, maxFine: 0.55, reduceScale: 0.24,
      uniformCount: 8,
      updateUniforms: (values, w, h, time, quality) => {
        values[0] = w;
        values[1] = h;
        values[2] = time;
        values[3] = inputState.colorT;
        values[4] = inputState.cameraYaw;
        values[5] = inputState.cameraPitch;
        values[6] = quality;
        values[7] = inputState.clickTime; // Passed into uniforms.click_time
      }
    },
    "Vaccine": {
      startScale: 0.35, minScale: 0.2, maxCoarse: 0.5, maxFine: 0.7, reduceScale: 0.3,
      uniformCount: 8,
      updateUniforms: (values, w, h, time, quality) => {
        values[0] = w;
        values[1] = h;
        values[2] = time;
        values[3] = inputState.colorT;
        values[4] = inputState.spinInput;   
        values[5] = inputState.cameraPitch; 
        values[6] = quality;
        values[7] = inputState.clickTime;
      }
    },
    "TheEyeYouSee": {
      startScale: 0.22, minScale: 0.15, maxCoarse: 0.42, maxFine: 0.55, reduceScale: 0.24,
      uniformCount: 8,
      updateUniforms: (values, w, h, time, quality) => {
        values[0] = w;
        values[1] = h;
        values[2] = time;
        values[3] = inputState.colorT;
        values[4] = inputState.cameraYaw;
        values[5] = inputState.cameraPitch;
        values[6] = quality;
        values[7] = inputState.clickTime;
      }
    }
  };

  // 3. DEDICATED ARTWORK ROUTING
  const ROUTE_MAP = {
    "/digitalartwork/a-wild-in-the-rose/": "WildInTheRose",
    "/digitalartwork/vaccine/": "Vaccine",
    "/digitalartwork/the-eye-you-see/": "TheEyeYouSee"
  };

  // 4. PRELOAD SHADER SOURCES VIA HUGO
  const SHADER_SOURCES = {
    "WildInTheRose": `{{ with resources.Get "shaders/TheRose.wgsl" }}{{ .Content }}{{ end }}`,
    "Vaccine": `{{ with resources.Get "shaders/Vaccine.wgsl" }}{{ .Content }}{{ end }}`,
    "TheEyeYouSee": `{{ with resources.Get "shaders/TheEye.wgsl" }}{{ .Content }}{{ end }}`
  };

  const GLOBAL_SETTINGS = {
    slowMs: 25.0, fastMs: 17.0, downStep: 0.040, upStep: 0.006, 
    govWindow: 20, scaleLerp: 14.0, qualityLerp: 2.8, maxBlur: 1.0, 
    spinSpeed: 0.6, minSpin: 0.2, colorFade: 3.0,
  };

  function environment() {
    const mm = (q) => window.matchMedia && matchMedia(q).matches;
    return { reduce: mm("(prefers-reduced-motion: reduce)"), coarse: mm("(pointer: coarse)") };
  }

  function pickDefaultOrRandomShader() {
    if (RANDOMIZE_DEFAULT_SHADER) {
      const keys = Object.keys(SHADER_REGISTRY);
      return keys[Math.floor(Math.random() * keys.length)];
    }
    return DEFAULT_SHADER;
  }

  async function initWebGPU() {
    if (!navigator.gpu) { console.log("WebGPU not supported"); return; }

    // Normalize path so it always ends with a single '/'
    let currentPath = window.location.pathname.replace(/\/?\$/, '/'); 
    let activeKey = null;

    if (ROUTE_MAP[currentPath]) {
      // 1. Dedicated artwork showcase page
      activeKey = ROUTE_MAP[currentPath];
    } else if (ALLOWED_MENU_ROUTES.includes(currentPath)) {
      // 2. Home screen, About Me, or top-level project/article menu pages only
      activeKey = pickDefaultOrRandomShader();
    }

    // If we are on a specific project or article page, activeKey is null and we exit immediately
    if (!activeKey || !SHADER_SOURCES[activeKey]) return; 

    const activeConfig = SHADER_REGISTRY[activeKey];
    const shaderCode = SHADER_SOURCES[activeKey];

    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) { console.log("No WebGPU adapter"); return; }
    const device = await adapter.requestDevice();

    const { reduce, coarse } = environment();
    const maxScale = coarse ? activeConfig.maxCoarse : activeConfig.maxFine;

    let showPerfHud = SHOW_PERF_HUD;
    let forceMaxQuality = FORCE_MAX_QUALITY;
    const getForcedScale = () => FORCE_NATIVE_RES ? 1.0 : maxScale;

    let targetScale = forceMaxQuality ? getForcedScale() : (reduce ? activeConfig.reduceScale : activeConfig.startScale);
    let renderScale = targetScale;

    document.body.style.backgroundColor = "transparent";
    const canvas = document.createElement("canvas");
    canvas.id = "webgpu-bg";
    document.body.prepend(canvas);
    Object.assign(canvas.style, {
      position: "fixed", top: "0", left: "0",
      width: "100vw", height: "100vh",
      zIndex: "-1", pointerEvents: "none",
    });

    // --- SUBTLE INTERACTION HINT POPUP ---
    let hintEl = null;
    let hintDismissed = false;
    function dismissHint() {
      if (!hintEl || hintDismissed) return;
      hintDismissed = true;
      hintEl.style.opacity = "0";
      hintEl.style.transform = "translate(-50%, 6px)";
      setTimeout(() => { if (hintEl && hintEl.parentNode) hintEl.remove(); }, 700);
    }

    if (SHOW_INTERACTION_HINT) {
      hintEl = document.createElement("div");
      hintEl.textContent = coarse
        ? "Tilt device to look around  •  Tap screen to shift"
        : "Move mouse to look around  •  Left-click to shift";
      Object.assign(hintEl.style, {
        position: "fixed",
        bottom: HINT_BOTTOM_OFFSET,
        left: "50%",
        transform: "translate(-50%, 8px)",
        zIndex: "9998",
        background: "rgba(12, 12, 14, 0.58)",
        backdropFilter: "blur(6px)",
        WebkitBackdropFilter: "blur(6px)",
        color: "rgba(240, 232, 232, 0.78)",
        fontFamily: "system-ui, -apple-system, sans-serif",
        fontSize: "12px",
        letterSpacing: "0.06em",
        padding: "7px 16px",
        borderRadius: "999px",
        border: "1px solid rgba(255, 255, 255, 0.12)",
        boxShadow: "0 4px 18px rgba(0, 0, 0, 0.35)",
        pointerEvents: "none",
        userSelect: "none",
        whiteSpace: "nowrap",
        opacity: "0",
        transition: "opacity 0.6s ease, transform 0.6s ease"
      });
      document.body.appendChild(hintEl);

      // Fade in shortly after page load, then auto-dismiss after HINT_DISPLAY_MS
      setTimeout(() => {
        if (!hintDismissed && hintEl) {
          hintEl.style.opacity = "1";
          hintEl.style.transform = "translate(-50%, 0px)";
        }
      }, 500);
      setTimeout(dismissHint, HINT_DISPLAY_MS);
    }

    // --- PERFORMANCE HUD ELEMENT (Secretly Toggleable) ---
    const perfHud = document.createElement("div");
    Object.assign(perfHud.style, {
      position: "fixed", top: "12px", left: "12px", zIndex: "9999",
      background: "rgba(0, 0, 0, 0.78)", color: "#00ff88",
      fontFamily: "monospace", fontSize: "12px", lineHeight: "1.5",
      padding: "8px 12px", borderRadius: "6px",
      border: "1px solid rgba(0, 255, 136, 0.3)",
      cursor: "pointer", userSelect: "none", whiteSpace: "pre",
      display: showPerfHud ? "block" : "none"
    });
    perfHud.textContent = "Measuring FPS...";
    document.body.appendChild(perfHud);

    function toggleMaxQualityMode() {
      forceMaxQuality = !forceMaxQuality;
      if (forceMaxQuality) {
        targetScale = getForcedScale();
      }
    }

    function setPerfHudVisible(visible) {
      showPerfHud = visible;
      perfHud.style.display = showPerfHud ? "block" : "none";
    }

    // Tapping/clicking directly on the HUD box toggles Max Quality (great for mobile testing)
    perfHud.addEventListener("pointerup", (e) => {
      e.stopPropagation();
      if (!showPerfHud) return;
      toggleMaxQualityMode();
    });

    const context = canvas.getContext("webgpu");
    const format = navigator.gpu.getPreferredCanvasFormat();

    const shaderModule = device.createShaderModule({ code: shaderCode });
    const pipeline = device.createRenderPipeline({
      layout: "auto",
      vertex: { module: shaderModule, entryPoint: "vs_main" },
      fragment: { module: shaderModule, entryPoint: "fs_main", targets: [{ format }] },
      primitive: { topology: "triangle-list" },
    });

    const uniformValues = new Float32Array(activeConfig.uniformCount);
    const uniformBuffer = device.createBuffer({
      size: uniformValues.byteLength,
      usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
    });
    const bindGroup = device.createBindGroup({
      layout: pipeline.getBindGroupLayout(0),
      entries: [{ binding: 0, resource: { buffer: uniformBuffer } }],
    });

    // -----------------------------------------------------------------------
    // --- INPUT SENSITIVITY MATH ---
    // -----------------------------------------------------------------------
    function applySensitivityCurve(value, power = 5) {
      return Math.sign(value) * Math.pow(Math.abs(value), power);
    }

    // -----------------------------------------------------------------------
    // --- INTERACTION & SECRET HUD LISTENERS ---
    // -----------------------------------------------------------------------
    let pressX = 0, pressY = 0;
    let usingTilt = false;
    let keyBuffer = "";
    let cornerTapCount = 0;
    let lastCornerTapTime = 0;

    // Triggers both the color crossfade and the shader's wild event
    const triggerShiftAndWild = () => {
      inputState.targetColorT = inputState.targetColorT === 0.0 ? 1.0 : 0.0;
      inputState.clickTime = performance.now() / 1000;
      dismissHint();
    };

    window.addEventListener("keydown", (e) => {
      // Ignore keystrokes when typing inside an input field
      if (e.target && e.target.closest && e.target.closest("input, textarea, select")) return;

      const k = e.key.toLowerCase();

      // 1. Track secret typed word (e.g. "fps") to toggle the Perf HUD on PC
      if (k.length === 1) {
        keyBuffer = (keyBuffer + k).slice(-SECRET_HUD_CODE.length);
        if (keyBuffer === SECRET_HUD_CODE) {
          setPerfHudVisible(!showPerfHud);
          keyBuffer = "";
          return;
        }
      }

      if (k === "c") triggerShiftAndWild();

      // 2. 'Q' only toggles max quality if the Perf HUD is currently enabled
      if (k === "q" && showPerfHud) {
        toggleMaxQualityMode();
      }
    });

    // 1. Unified Pointer Down (Captures Mouse Click & Screen Touch)
    window.addEventListener("pointerdown", (e) => { 
      pressX = e.clientX; 
      pressY = e.clientY; 
    });

    // 2. Unified Pointer Up
    window.addEventListener("pointerup", (e) => {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission()
          .then(permissionState => {
            if (permissionState === 'granted') {
              window.addEventListener('deviceorientation', handleOrientation);
            }
          }).catch(console.error);
      }

      // Only trigger on left-click (button 0) or touch tap, ignoring right-click context menus
      if (e.button !== undefined && e.button !== 0) return;

      // Ignore clicks on the HUD itself or on interactive links/buttons
      if (e.target === perfHud || (e.target && e.target.closest && e.target.closest("a, button, input, textarea, select"))) return;

      const travel = Math.abs(e.clientX - pressX) + Math.abs(e.clientY - pressY);
      if (travel < 15) {
        // Secret 5-tap zone in the top-left corner (100x100px) for Phone & PC
        if (e.clientX < 100 && e.clientY < 100) {
          const nowMs = performance.now();
          cornerTapCount = (nowMs - lastCornerTapTime < 600) ? cornerTapCount + 1 : 1;
          lastCornerTapTime = nowMs;

          if (cornerTapCount >= SECRET_CORNER_TAPS) {
            setPerfHudVisible(!showPerfHud);
            cornerTapCount = 0;
            return; // Don't trigger color shift on the 5th unlock tap
          }
        } else {
          cornerTapCount = 0;
        }

        triggerShiftAndWild();
      }
    });

    // 3. Gyroscope Translation Logic
    function handleOrientation(e) {
      if (e.beta === null || e.gamma === null) return;
      usingTilt = true;

      let rawYaw = Math.max(-1.0, Math.min(1.0, e.gamma / 30.0));
      let rawPitch = Math.max(-1.0, Math.min(1.0, (e.beta - 45.0) / 30.0));

      inputState.spinInput = applySensitivityCurve(rawYaw, 3);
      inputState.cameraPitch = applySensitivityCurve(rawPitch, 3);
    }

    window.addEventListener("deviceorientation", handleOrientation);

    // 4. Pointer Move (Only affects desktop/mouse users now)
    window.addEventListener("pointermove", (e) => {
      if (usingTilt) return;
      
      let rawYaw = Math.max(-1.0, Math.min(1.0, (e.clientX / window.innerWidth) * 2.0 - 1.0));
      let rawPitch = Math.max(-1.0, Math.min(1.0, (e.clientY / window.innerHeight) * 2.0 - 1.0));

      inputState.spinInput = applySensitivityCurve(rawYaw, 3);
      inputState.cameraPitch = applySensitivityCurve(rawPitch, 3);
    });
    // -----------------------------------------------------------------------

    // --- sizing & continuous quality ---
    context.configure({ device, format, alphaMode: "premultiplied" });
    
    let currentQuality = forceMaxQuality ? 2.0 : 0.0;
    let targetQuality = currentQuality;
    let lastBlur = -1;

    function applySize() {
      const w = Math.max(1, Math.floor(window.innerWidth * renderScale));
      const h = Math.max(1, Math.floor(window.innerHeight * renderScale));
      if (w === canvas.width && h === canvas.height) return;
      canvas.width = w;
      canvas.height = h;
    }

    function applyVisual(dt = 0.016) {
      const t = Math.min(1.0, Math.max(0.0, (renderScale - activeConfig.minScale) / Math.max(1e-4, (maxScale - activeConfig.minScale))));
      
      if (forceMaxQuality) {
        targetQuality = 2.0;
      } else if (reduce) {
        targetQuality = 0.5;
      } else {
        targetQuality = t * 2.0; // Continuous 0.0 -> 2.0 float instead of discrete integer steps
      }

      // Smoothly interpolate currentQuality so shader elements fade/grow in gently
      currentQuality += (targetQuality - currentQuality) * Math.min(1.0, GLOBAL_SETTINGS.qualityLerp * dt);

      if (reduce || forceMaxQuality) {
        if (lastBlur !== 0) { canvas.style.filter = "blur(0px)"; lastBlur = 0; }
        return;
      }
      const blur = GLOBAL_SETTINGS.maxBlur * (1.0 - Math.min(1.0, currentQuality * 0.5));
      if (Math.abs(blur - lastBlur) >= 0.15) {
        canvas.style.filter = `blur(${blur.toFixed(2)}px)`;
        lastBlur = blur;
      }
    }

    let lastPhysW = 0, lastPhysH = 0;
    function onResize() {
      const dpr = window.devicePixelRatio || 1;
      const physW = Math.round(window.innerWidth * dpr);
      const physH = Math.round(window.innerHeight * dpr);
      if (Math.abs(physW - lastPhysW) <= 2 && Math.abs(physH - lastPhysH) <= 2) return;
      lastPhysW = physW; lastPhysH = physH;
      applySize();
    }
    window.addEventListener("resize", onResize);
    onResize();
    applyVisual(0.0);

    // --- adaptive governor & HUD updater ---
    let frameMs = [];
    function governor() {
      if (frameMs.length < GLOBAL_SETTINGS.govWindow) return;
      const avg = frameMs.reduce((a, b) => a + b, 0) / frameMs.length;
      const maxSpike = Math.max(...frameMs);
      frameMs.length = 0;

      if (showPerfHud) {
        const fps = 1000.0 / Math.max(0.001, avg);
        const scalePct = Math.round(renderScale * 100);
        const modeLabel = forceMaxQuality ? "LOCKED MAX (Q / Tap)" : "ADAPTIVE (Q / Tap)";
        perfHud.textContent =
          `FPS:     ${fps.toFixed(1)} (${avg.toFixed(2)} ms | max ${maxSpike.toFixed(1)} ms)\n` +
          `Res:     ${canvas.width}x${canvas.height} (scale ${scalePct}%)\n` +
          `Quality: ${currentQuality.toFixed(2)} / 2.00 [${modeLabel}]`;
      }

      if (forceMaxQuality) {
        targetScale = getForcedScale();
        return;
      }

      if (reduce) return;

      if (avg > GLOBAL_SETTINGS.slowMs) {
        const over = avg / GLOBAL_SETTINGS.slowMs;
        const step = GLOBAL_SETTINGS.downStep * Math.min(4, over);
        targetScale = Math.max(activeConfig.minScale, targetScale - step);
      } else if (avg < GLOBAL_SETTINGS.fastMs) {
        targetScale = Math.min(maxScale, targetScale + GLOBAL_SETTINGS.upStep);
      }
    }

    // --- frame loop ---
    let lastTime = performance.now() / 1000;

    function frame() {
      const now = performance.now() / 1000;
      const rawDt = now - lastTime;
      const dt = Math.min(rawDt, 0.1);
      lastTime = now;

      // Track un-clamped frame delta in ms for accurate performance measurement
      frameMs.push(rawDt * 1000);
      governor();

      if (forceMaxQuality) {
        renderScale += (getForcedScale() - renderScale) * Math.min(1, GLOBAL_SETTINGS.scaleLerp * dt);
      } else {
        renderScale += (targetScale - renderScale) * Math.min(1, GLOBAL_SETTINGS.scaleLerp * dt);
      }
      applySize();
      applyVisual(dt);

      let speed = inputState.spinInput * GLOBAL_SETTINGS.spinSpeed;
      if (speed >= 0 && speed < GLOBAL_SETTINGS.minSpin) speed = GLOBAL_SETTINGS.minSpin;
      else if (speed < 0 && speed > -GLOBAL_SETTINGS.minSpin) speed = -GLOBAL_SETTINGS.minSpin;
      inputState.cameraYaw += speed * dt;

      inputState.colorT += (inputState.targetColorT - inputState.colorT) * GLOBAL_SETTINGS.colorFade * dt;

      activeConfig.updateUniforms(uniformValues, canvas.width, canvas.height, now, currentQuality);
      device.queue.writeBuffer(uniformBuffer, 0, uniformValues);

      const encoder = device.createCommandEncoder();
      const pass = encoder.beginRenderPass({
        colorAttachments: [{
          view: context.getCurrentTexture().createView(),
          clearValue: { r: 0.0, g: 0.0, b: 0.0, a: 0.0 },
          loadOp: "clear",
          storeOp: "store",
        }],
      });
      pass.setPipeline(pipeline);
      pass.setBindGroup(0, bindGroup);
      pass.draw(3);
      pass.end();
      device.queue.submit([encoder.finish()]);

      requestAnimationFrame(frame);
    }
    frame();
  }

  initWebGPU();
</script>
